<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" width="1280" height="472"
     role="img" aria-label="Ready to use and Growing, connected by the on-chain allocation policy">
  <title>Ready to use ⇄ Growing</title>
  <desc>Generated by scripts/build-readme-assets.ts from @trinqa/tokens (light surface).</desc>
  <defs>
