    <style>
      .flowline { stroke-dasharray: 4 6; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -20 } }
      .backline { stroke-dasharray: 4 6; animation: backflow 2.1s linear infinite; }
      @keyframes backflow { to { stroke-dashoffset: 20 } }
      .beadA { offset-path: path("M170 106 H245"); animation: run 4.2s linear infinite; }
      .beadB { offset-path: path("M395 106 H470"); animation: run 4.2s linear infinite; animation-delay: 0.7s; }
      .beadC { offset-path: path("M545 148 V176 H95 V148"); animation: run 5.6s linear infinite; animation-delay: 1.4s; }
      @keyframes run { 0% { offset-distance: 0%; opacity: 0 } 10% { opacity:1 } 90% { opacity:1 } 100% { offset-distance: 100%; opacity: 0 } }
      .barReady { transform-origin: 38px 0; animation: barReady 8.4s ease-in-out infinite; }
      .barGrowing { transform-origin: 488px 0; animation: barGrowing 8.4s ease-in-out infinite; }
      @keyframes barReady { 0%,100% { transform: scaleX(.42) } 45%,55% { transform: scaleX(.78) } }
      @keyframes barGrowing { 0%,100% { transform: scaleX(.78) } 45%,55% { transform: scaleX(.42) } }
      .halo { animation: halo 4.2s ease-in-out infinite; transform-origin: 320px 106px; }
      @keyframes halo { 0%,100% { opacity:0.35 } 50% { opacity:0.7 } }
      .tick { animation: tick 5.6s ease-in-out infinite; }
      .t2 { animation-delay: 1.4s } .t3 { animation-delay: 2.8s }
      @keyframes tick { 0%,100% { opacity:0.45 } 18%,26% { opacity:1 } }
      @media (prefers-reduced-motion: reduce) {
        .flowline,.backline,.beadA,.beadB,.beadC,.barReady,.barGrowing,.halo,.tick { animation: none }
      }
    </style>
  </defs>

  <rect x="8" y="8" width="624" height="220" rx="20" fill="url(#body)" stroke="#E5E5E5"/>

