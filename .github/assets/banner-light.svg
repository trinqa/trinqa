<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Trinqa — self-driving portfolio">
  <title>Trinqa — self-driving portfolio</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF3F4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#08AFD3" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#08AFD3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#08AFD3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#08AFD3" stop-opacity="0"/>
      <stop offset="45%" stop-color="#08AFD3" stop-opacity="1"/>
      <stop offset="55%" stop-color="#079FC0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#079FC0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#08AFD3" stop-opacity="0"/>
      <stop offset="25%" stop-color="#08AFD3" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#079FC0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#079FC0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardclip"><rect x="8" y="8" width="1264" height="384" rx="28"/></clipPath>
    <mask id="wordmask">
      <rect x="0" y="0" width="1280" height="400" fill="black"/>
      <text x="300" y="186" font-family="Inter, 'SF Pro Display', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="92" font-weight="800" letter-spacing="6" fill="white">TRINQA</text>
    </mask>
    <style>
      .halfL { animation: driftL 7s cubic-bezier(.45,0,.2,1) infinite; }
      .halfR { animation: driftR 7s cubic-bezier(.45,0,.2,1) infinite; }
      @keyframes driftL { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-7px,-6px); } }
      @keyframes driftR { 0%,100% { transform: translate(0,0); } 50% { transform: translate(7px,6px); } }
      .pulse { animation: pulse 7s ease-in-out infinite; transform-origin: 174px 200px; }
      @keyframes pulse { 0%,100% { opacity:.35; transform: scale(.94);} 50% { opacity:.75; transform: scale(1.06);} }
      .orbit { animation: orbit 11s linear infinite; transform-origin: 174px 200px; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      .sweep { animation: sweep 4.6s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-560px);} 55%,100% { transform: translateX(660px);} }
      .hl { opacity: 0; animation: hl 7s ease-in-out infinite; }
      .h1 { animation-delay:0s } .h2 { animation-delay:1.1s } .h3 { animation-delay:2.2s }
      .h4 { animation-delay:3.3s } .h5 { animation-delay:4.4s }
      @keyframes hl { 0%,100% { opacity:0 } 6%,12% { opacity:1 } 20% { opacity:0 } }
      .dash { stroke-dasharray: 10 14; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -48; } }
      .bead { animation: bead 5.2s cubic-bezier(.5,0,.5,1) infinite; }
      .bead2 { animation: bead 5.2s cubic-bezier(.5,0,.5,1) infinite; animation-delay: 2.6s; }
      @keyframes bead { 0% { transform: translateX(0); opacity:0 } 8% { opacity:1 } 92% { opacity:1 } 100% { transform: translateX(1020px); opacity:0 } }
      @media (prefers-reduced-motion: reduce) {
        .halfL,.halfR,.pulse,.orbit,.sweep,.dash,.bead,.bead2,.hl { animation: none; }
      }
    </style>
  </defs>

  <rect x="8" y="8" width="1264" height="384" rx="28" fill="url(#card)"/>
  <g clip-path="url(#cardclip)" opacity="0.9">
    <g stroke="#E4E9EA" stroke-width="1">
      <path d="M8 88H1272M8 168H1272M8 248H1272M8 328H1272"/>
      <path d="M168 8V392M328 8V392M488 8V392M648 8V392M808 8V392M968 8V392M1128 8V392"/>
    </g>
  </g>
  <rect x="8.5" y="8.5" width="1263" height="383" rx="27.5" fill="none" stroke="#E1E6E8"/>

  <!-- brand mark: two halves of one portfolio -->
  <g>
    <circle class="pulse" cx="174" cy="200" r="120" fill="url(#glow)"/>
    <g class="orbit">
      <circle cx="174" cy="80" r="4.5" fill="#08AFD3" opacity=".9"/>
      <circle cx="174" cy="320" r="3" fill="#079FC0" opacity=".6"/>
    </g>
    <g fill="#111111" stroke="#111111" stroke-width="7" stroke-linejoin="round">
      <path class="halfL" d="M166 115 A62 62 0 0 0 166 239 Z"/>
      <path class="halfR" d="M181 161 A62 62 0 0 1 181 285 Z"/>
    </g>
  </g>

  <!-- wordmark with light sweep -->
  <g mask="url(#wordmask)">
    <rect x="280" y="92" width="700" height="120" fill="#111111"/>
    <rect class="sweep" x="280" y="92" width="240" height="120" fill="url(#shine)"/>
  </g>

  <g font-family="Inter, 'SF Pro Text', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="302" y="236" font-size="34" font-weight="600" fill="#111111" letter-spacing="-0.2">Self-driving portfolio</text>
    <text x="302" y="272" font-size="21" font-weight="450" fill="#6C767C">Money stays ready to use. The rest goes to work.</text>
  </g>

  <!-- capability chips -->
  <g font-family="Inter, 'SF Mono', ui-monospace, Menlo, monospace" font-size="16" font-weight="600">
    <g><rect x="302" y="300" width="150" height="40" rx="20" fill="#FFFFFF" stroke="#E1E6E8"/><rect class="hl h1" x="302" y="300" width="150" height="40" rx="20" fill="none" stroke="#08AFD3" stroke-width="1.5"/><text x="377" y="326" fill="#111111" text-anchor="middle">Stellar</text></g>
    <g><rect x="464" y="300" width="150" height="40" rx="20" fill="#FFFFFF" stroke="#E1E6E8"/><rect class="hl h2" x="464" y="300" width="150" height="40" rx="20" fill="none" stroke="#08AFD3" stroke-width="1.5"/><text x="539" y="326" fill="#111111" text-anchor="middle">Soroban</text></g>
    <g><rect x="626" y="300" width="150" height="40" rx="20" fill="#FFFFFF" stroke="#E1E6E8"/><rect class="hl h3" x="626" y="300" width="150" height="40" rx="20" fill="none" stroke="#08AFD3" stroke-width="1.5"/><text x="701" y="326" fill="#111111" text-anchor="middle">SEP-6/10/38</text></g>
    <g><rect x="788" y="300" width="150" height="40" rx="20" fill="#FFFFFF" stroke="#E1E6E8"/><rect class="hl h4" x="788" y="300" width="150" height="40" rx="20" fill="none" stroke="#08AFD3" stroke-width="1.5"/><text x="863" y="326" fill="#111111" text-anchor="middle">DeFindex</text></g>
    <g><rect x="950" y="300" width="150" height="40" rx="20" fill="#FFFFFF" stroke="#E1E6E8"/><rect class="hl h5" x="950" y="300" width="150" height="40" rx="20" fill="none" stroke="#08AFD3" stroke-width="1.5"/><text x="1025" y="326" fill="#111111" text-anchor="middle">Soroswap</text></g>
  </g>

  <!-- settlement rail -->
  <g>
    <path d="M130 366 H1150" stroke="url(#rail)" stroke-width="2" fill="none"/>
    <path class="dash" d="M130 366 H1150" stroke="#08AFD3" stroke-width="2" stroke-opacity=".45" fill="none"/>
    <g class="bead"><circle cx="130" cy="366" r="4" fill="#08AFD3"/></g>
    <g class="bead2"><circle cx="130" cy="366" r="3" fill="#079FC0"/></g>
  </g>
</svg>
