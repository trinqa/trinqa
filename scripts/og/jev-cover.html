<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#111;color:#fff;
  font-family:-apple-system,system-ui,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;position:relative}
.glow{position:absolute;width:820px;height:820px;border-radius:50%;
  background:radial-gradient(circle,rgba(57,135,229,.22) 0%,rgba(57,135,229,.07) 40%,rgba(57,135,229,0) 66%);
  right:-250px;top:-210px}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:60px 60px;
  -webkit-mask-image:radial-gradient(ellipse 85% 85% at 78% 12%,#000 0%,transparent 70%)}
.wrap{position:relative;height:100%;padding:56px 64px 52px;display:flex;flex-direction:column}
.brandrow{display:flex;align-items:center;width:100%;margin-bottom:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:29px;height:29px;object-fit:contain;display:block;filter:brightness(0) invert(1);opacity:.95}
.brand span{font-size:19px;font-weight:600;letter-spacing:-.02em;color:rgba(255,255,255,.92)}
.eyebrow{margin-left:auto;font-size:12.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.36)}

.cols{display:flex;align-items:center;gap:56px}
.left{flex:1 1 0;min-width:0}
h1{font-size:88px;line-height:.99;letter-spacing:-.042em;font-weight:700}
h1 .jev{color:#3987e5}
p.sub{margin-top:24px;font-size:23px;line-height:1.38;letter-spacing:-.018em;color:rgba(255,255,255,.6);max-width:24ch}

.panel{flex:0 0 366px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);
  border-radius:22px;padding:32px 30px 26px}
.hero{font-size:76px;font-weight:700;letter-spacing:-.045em;line-height:1;display:flex;align-items:baseline;gap:4px}
.hero .of{font-size:38px;font-weight:600;color:rgba(255,255,255,.4);letter-spacing:-.02em}
.hero .n{color:#3987e5}
.herocap{margin-top:12px;font-size:16.5px;line-height:1.4;letter-spacing:-.012em;color:rgba(255,255,255,.62)}
.rule{height:1px;background:rgba(255,255,255,.1);margin:22px 0 18px}
.chartcap{font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.36);margin-bottom:12px}
.strip{display:flex;align-items:flex-end;gap:6px;height:74px}
.seg{flex:1;border-radius:5px 5px 2px 2px}
.seg.adv{background:#3987e5}
.seg.det{background:#7b7b7b}
.legend{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13.5px;color:rgba(255,255,255,.55);letter-spacing:-.008em}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}

.foot{margin-top:auto;padding-top:34px;display:flex;align-items:center;justify-content:space-between}
.foot .who{font-size:16px;color:rgba(255,255,255,.38);letter-spacing:-.01em}
.url{font-size:17px;font-weight:550;letter-spacing:-.015em;color:rgba(255,255,255,.55)}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="wrap">
  <div class="brandrow">
    <div class="brand"><img src="logo.png" alt=""><span>Trinqa</span></div>
    <div class="eyebrow">Engineering</div>
  </div>

  <div class="cols">
    <div class="left">
      <h1><span class="jev">Jev</span> gets a vote,<br>not a veto.</h1>
      <p class="sub">How a decision model helps pick a payout route &mdash; without touching the money.</p>
    </div>

    <div class="panel">
      <div class="hero"><span class="n">5</span><span class="of">&thinsp;/&thinsp;7</span></div>
      <div class="herocap">scoring factors the model may advise on</div>
      <div class="rule"></div>
      <div class="chartcap">Weight per factor</div>
      <div class="strip">
        <div class="seg det" style="height:100%"></div>
        <div class="seg det" style="height:43%"></div>
        <div class="seg adv" style="height:43%"></div>
        <div class="seg adv" style="height:29%"></div>
        <div class="seg adv" style="height:29%"></div>
        <div class="seg adv" style="height:29%"></div>
        <div class="seg adv" style="height:14%"></div>
      </div>
      <div class="legend">
        <span><i style="background:#7b7b7b"></i>We compute</span>
        <span><i style="background:#3987e5"></i>Jev may advise</span>
      </div>
    </div>
  </div>

  <div class="foot">
    <div class="who">Cost and speed are arithmetic &mdash; they never leave our code.</div>
    <div class="url">trinqa.com</div>
  </div>
</div>
</body></html>
