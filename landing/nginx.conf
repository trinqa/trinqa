server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # trinqa.com is canonical; www is only an alias.
    if ($host = www.trinqa.com) {
        return 301 https://trinqa.com$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/markdown
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;
    gzip_min_length 1024;

    # nginx drops inherited add_header directives in any block that sets one of its
    # own, so every location below repeats these three.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Content-hashed build assets never change.
    location /_next/static/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Images and icons are stable but not hashed, so revalidate daily.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /site.webmanifest {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=86400";
        default_type application/manifest+json;
    }

    # The article shipped briefly under a slug without "jev" in it.
    location = /writing/a-vote-not-a-veto/ {
        return 301 https://trinqa.com/writing/jev-a-vote-not-a-veto/;
    }

    location = /404.html {
        internal;
    }

    # A static export has exactly one page: an unknown path is a 404, not the homepage.
    # Serving index.html everywhere would turn every typo into a soft 404 for crawlers.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
